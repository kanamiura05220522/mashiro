<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ましろの星占い</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;600&family=Zen+Maru+Gothic:wght@400;500&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --night: #0e0c1a;
  --night2: #16132a;
  --night3: #1e1a35;
  --star-gold: #f0d070;
  --star-silver: #c8d8f0;
  --blush: #e8a0b8;
  --text: #e8e0f0;
  --text-mid: #a898c0;
  --text-soft: #6860888;
  --border: rgba(200,180,255,0.12);
  --glow: rgba(180,140,255,0.15);
}

html, body {
  min-height: 100%;
  background: var(--night);
  color: var(--text);
  font-family: 'Zen Maru Gothic', sans-serif;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 40px 20px 60px;
  position: relative;
  overflow-x: hidden;
}

/* 星空背景 */
.starfield {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
}

.star-dot {
  position: absolute;
  border-radius: 50%;
  background: white;
  animation: twinkle linear infinite;
}

@keyframes twinkle {
  0%, 100% { opacity: 0.2; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.3); }
}

/* 星雲グラデ */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse at 20% 30%, rgba(100,60,180,0.18) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 70%, rgba(60,100,180,0.12) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 50%, rgba(180,60,120,0.08) 0%, transparent 60%);
  pointer-events: none;
}

.wrapper {
  width: 100%;
  max-width: 560px;
  position: relative;
  z-index: 1;
}

/* ===== ヘッダー ===== */
.header {
  text-align: center;
  margin-bottom: 40px;
  animation: rise 0.9s cubic-bezier(0.22,1,0.36,1) both;
}

.date-label {
  font-family: 'Noto Serif JP', serif;
  font-size: 12px;
  letter-spacing: 0.25em;
  color: var(--text-mid);
  margin-bottom: 24px;
}

.avatar-container {
  position: relative;
  display: inline-block;
  margin-bottom: 20px;
}

/* 月 */
.moon {
  position: absolute;
  top: -8px; right: -14px;
  font-size: 22px;
  opacity: 0.8;
  animation: moon-glow 4s ease-in-out infinite;
}

@keyframes moon-glow {
  0%, 100% { transform: rotate(-10deg) scale(1); opacity: 0.7; }
  50% { transform: rotate(10deg) scale(1.1); opacity: 1; }
}

.avatar-glow {
  position: absolute;
  inset: -14px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(160,120,255,0.25) 0%, transparent 70%);
  animation: breathe 4s ease-in-out infinite;
}

@keyframes breathe {
  0%, 100% { transform: scale(1); opacity: 0.7; }
  50% { transform: scale(1.1); opacity: 1; }
}

.avatar-ring-outer {
  position: absolute;
  inset: -6px;
  border-radius: 50%;
  border: 1px solid rgba(200,160,255,0.3);
  animation: spin-slow 20s linear infinite;
}

@keyframes spin-slow {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.avatar {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  object-fit: cover;
  position: relative;
  z-index: 1;
  border: 2px solid rgba(200,160,255,0.3);
  animation: float 5s ease-in-out infinite;
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-7px); }
}

.name {
  font-family: 'Noto Serif JP', serif;
  font-size: 26px;
  font-weight: 600;
  letter-spacing: 0.15em;
  background: linear-gradient(135deg, #f0d070, #e8c0f8, #a0c8f8);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 6px;
}

.tagline {
  font-size: 12px;
  letter-spacing: 0.2em;
  color: var(--text-mid);
}

/* ===== 星座グリッド ===== */
.seiza-section {
  margin-bottom: 32px;
  animation: rise 0.9s cubic-bezier(0.22,1,0.36,1) 0.1s both;
}

.section-title {
  text-align: center;
  font-size: 11px;
  letter-spacing: 0.25em;
  color: var(--text-mid);
  margin-bottom: 16px;
}

.seiza-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}

.seiza-btn {
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 6px 8px;
  cursor: pointer;
  transition: all 0.25s;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
}

.seiza-btn:hover {
  background: rgba(160,120,255,0.1);
  border-color: rgba(200,160,255,0.35);
  transform: translateY(-2px);
}

.seiza-btn.active {
  background: rgba(160,120,255,0.2);
  border-color: rgba(200,160,255,0.6);
  box-shadow: 0 0 12px rgba(160,120,255,0.2);
}

.seiza-sym {
  font-size: 20px;
  line-height: 1;
}

.seiza-name {
  font-family: 'Zen Maru Gothic', sans-serif;
  font-size: 11px;
  color: var(--text-mid);
  letter-spacing: 0.04em;
}

.seiza-btn.active .seiza-name {
  color: rgba(220,200,255,0.9);
}

.seiza-date {
  font-size: 9px;
  color: rgba(150,140,180,0.7);
  letter-spacing: 0;
}

/* ===== カード ===== */
.card {
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 36px 32px;
  min-height: 260px;
  position: relative;
  animation: rise 0.9s cubic-bezier(0.22,1,0.36,1) 0.2s both;
  backdrop-filter: blur(4px);
}

/* 角の星 */
.card::before {
  content: '✦';
  position: absolute;
  top: 12px; left: 16px;
  font-size: 10px;
  color: rgba(240,208,112,0.3);
}
.card::after {
  content: '✦';
  position: absolute;
  bottom: 12px; right: 16px;
  font-size: 10px;
  color: rgba(240,208,112,0.3);
}

/* 初期 */
.initial-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 188px;
  gap: 20px;
}

.hint-text {
  font-size: 13px;
  color: var(--text-mid);
  letter-spacing: 0.1em;
}

.start-btn {
  background: linear-gradient(135deg, rgba(140,100,240,0.3), rgba(100,140,240,0.3));
  border: 1px solid rgba(200,160,255,0.4);
  border-radius: 100px;
  padding: 13px 40px;
  font-family: 'Noto Serif JP', serif;
  font-size: 15px;
  font-weight: 300;
  letter-spacing: 0.2em;
  color: var(--text);
  cursor: pointer;
  transition: all 0.3s;
}

.start-btn:hover {
  background: linear-gradient(135deg, rgba(140,100,240,0.5), rgba(100,140,240,0.5));
  border-color: rgba(200,160,255,0.7);
  box-shadow: 0 0 20px rgba(160,120,255,0.25);
  transform: translateY(-2px);
}

.start-btn:disabled {
  opacity: 0.5; cursor: not-allowed; transform: none;
}

/* ローディング */
.loading-state {
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 188px;
  gap: 20px;
}

.orbit {
  position: relative;
  width: 60px;
  height: 60px;
}

.orbit-ring {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 1px solid rgba(200,160,255,0.3);
  border-top-color: rgba(200,160,255,0.9);
  animation: orbit-spin 1.2s linear infinite;
}

.orbit-ring:nth-child(2) {
  inset: 8px;
  border-top-color: rgba(240,208,112,0.9);
  animation-duration: 0.8s;
  animation-direction: reverse;
}

@keyframes orbit-spin {
  to { transform: rotate(360deg); }
}

.orbit-center {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  animation: twinkle 1s ease-in-out infinite;
}

.loading-text {
  font-size: 13px;
  letter-spacing: 0.2em;
  color: var(--text-mid);
  animation: fade-pulse 1.5s ease-in-out infinite;
}

@keyframes fade-pulse {
  0%, 100% { opacity: 0.4; }
  50% { opacity: 1; }
}

/* 結果 */
.result-state {
  display: none;
  flex-direction: column;
  gap: 20px;
}

.result-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}

.result-seiza {
  display: flex;
  align-items: center;
  gap: 10px;
}

.result-sym {
  font-size: 28px;
}

.result-name {
  font-family: 'Noto Serif JP', serif;
  font-size: 20px;
  font-weight: 600;
  letter-spacing: 0.1em;
  background: linear-gradient(135deg, #f0d070, #c8b0f8);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.result-rank {
  font-size: 11px;
  letter-spacing: 0.12em;
  color: var(--text-mid);
  margin-top: 2px;
}

.result-stars {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
}

.stars-row { display: flex; gap: 3px; }
.star { font-size: 13px; color: var(--star-gold); }
.star.empty { color: rgba(200,200,255,0.15); }

.fortune-body {
  font-family: 'Noto Serif JP', serif;
  font-size: 15px;
  font-weight: 300;
  line-height: 2.2;
  color: rgba(232,224,248,0.9);
  letter-spacing: 0.04em;
  white-space: pre-line;
  animation: fadeWords 0.8s ease both;
}

@keyframes fadeWords {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.lucky-box {
  background: rgba(240,208,112,0.06);
  border: 1px solid rgba(240,208,112,0.2);
  border-radius: 10px;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.lucky-label {
  font-size: 10px;
  letter-spacing: 0.2em;
  color: var(--star-gold);
  white-space: nowrap;
}

.lucky-value {
  font-size: 14px;
  color: rgba(240,208,112,0.9);
  letter-spacing: 0.05em;
}

.result-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: 16px;
  border-top: 1px solid var(--border);
}

.sig {
  font-size: 12px;
  color: var(--text-mid);
  letter-spacing: 0.1em;
}

.retry-btn {
  background: none;
  border: 1px solid var(--border);
  border-radius: 100px;
  padding: 6px 18px;
  font-family: 'Zen Maru Gothic', sans-serif;
  font-size: 12px;
  color: var(--text-mid);
  cursor: pointer;
  letter-spacing: 0.08em;
  transition: all 0.2s;
}

.retry-btn:hover {
  border-color: rgba(200,160,255,0.4);
  color: var(--text);
}

/* エラー */
.error-state {
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 188px;
  gap: 14px;
  text-align: center;
}

.error-text {
  font-size: 13px;
  color: rgba(232,160,184,0.8);
  letter-spacing: 0.06em;
}

/* フッター */
.footer {
  margin-top: 28px;
  text-align: center;
  font-size: 11px;
  letter-spacing: 0.2em;
  color: rgba(168,152,192,0.5);
  animation: rise 0.9s cubic-bezier(0.22,1,0.36,1) 0.3s both;
}

@keyframes rise {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: translateY(0); }
}

/* 流れ星 */
.shooting-star {
  position: fixed;
  width: 2px;
  height: 2px;
  background: white;
  border-radius: 50%;
  pointer-events: none;
  animation: shoot linear forwards;
}

@keyframes shoot {
  from { opacity: 1; transform: translate(0,0) rotate(45deg); box-shadow: 0 0 4px white, -60px -10px 30px transparent; }
  to { opacity: 0; transform: translate(200px, 200px) rotate(45deg); box-shadow: 0 0 1px white, -120px -20px 0 transparent; }
}
</style>
</head>

const RANKS = ['第1位','第2位','第3位','第4位','第5位','第6位','第7位','第8位','第9位','第10位','第11位','第12位'];

let selectedSeiza = null;

// 日付
const d = new Date();
const wdays = ['日','月','火','水','木','金','土'];

  `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${wdays[d.getDay()]}）`;

// 星座グリッド生成
const grid = document.getElementById('seizaGrid');

  const btn = document.createElement('button');
  btn.className = 'seiza-btn';
  btn.dataset.idx = i;
  btn.innerHTML = `
    <div class="seiza-sym">${s.sym}</div>
    <div class="seiza-name">${s.name}</div>
    <div class="seiza-date">${s.date}</div>
  `;
  btn.addEventListener('click', () => {
    document.querySelectorAll('.seiza-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedSeiza = s;
    document.getElementById('startBtn').disabled = false;
    document.getElementById('hintText').textContent = `${s.sym} ${s.name}の運勢を占います`;
    show('initial');
  });
  grid.appendChild(btn);
});

// イベント
document.getElementById('startBtn').addEventListener('click', doFortune);
document.getElementById('retryBtn').addEventListener('click', doFortune);
document.getElementById('errorRetryBtn').addEventListener('click', doFortune);

function show(state) {
  ['initial','loading','result','error'].forEach(s => {
    const el = document.getElementById(s + 'State');
    const isResult = s === 'result';
    el.style.display = s === state ? 'flex' : 'none';
  });
}

function renderStars(n) {
  return Array.from({length:5}, (_,i) =>
    `<span class="star ${i<n?'':'empty'}">★</span>`
  ).join('');
}

// 流れ星
function shootingStar() {
  const s = document.createElement('div');
  s.className = 'shooting-star';
  s.style.top = Math.random() * 50 + '%';
  s.style.left = Math.random() * 80 + '%';
  s.style.animationDuration = (0.6 + Math.random()*0.4) + 's';
  document.body.appendChild(s);
  setTimeout(() => s.remove(), 1200);
}

// 星空生成
function createStarfield() {
  const sf = document.getElementById('starfield');
  for (let i = 0; i < 80; i++) {
    const dot = document.createElement('div');
    dot.className = 'star-dot';
    const size = Math.random() * 2 + 0.5;
    dot.style.cssText = `
      width:${size}px; height:${size}px;
      top:${Math.random()*100}%;
      left:${Math.random()*100}%;
      animation-duration:${2+Math.random()*4}s;
      animation-delay:${Math.random()*4}s;
    `;
    sf.appendChild(dot);
  }
}
createStarfield();

// ランダムな順位
function getRandomRank() {
  return RANKS[Math.floor(Math.random() * 12)];
}

async function doFortune() {
  if (!selectedSeiza) return;
  show('loading');

  const today = document.getElementById('dateLabel').textContent;
  const prompt = `あなたは「ましろ」という名前の白いチンチラの占い師です。星の力を借りて運命を読みます。

今日（${today}）の${selectedSeiza.name}（${selectedSeiza.sym}）の運勢を占ってください。

条件：
- 占い文は3〜4文（改行で区切る）
- やわらかく神秘的な語り口
- ラッキーアイテムを1つ最後の行に「ラッキーアイテム：〇〇」という形式で含める（アイテムは短く具体的に）
- 上記以外の余計な前置きや注釈は不要

占い文のみ出力してください。`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 350,
        messages: [{ role: 'user', content: prompt }]
      })
    });

    if (!res.ok) throw new Error(res.status.toString());
    const data = await res.json();
    const text = data.content[0].text.trim();

    // ラッキーアイテムを抽出
    const lines = text.split('\n').filter(l => l.trim());
    const luckyLine = lines.find(l => l.includes('ラッキーアイテム'));
    const mainText = lines.filter(l => !l.includes('ラッキーアイテム')).join('\n');
    const luckyValue = luckyLine ? luckyLine.replace(/.*ラッキーアイテム[：:]\s*/, '') : '';

    const stars = Math.floor(Math.random() * 3) + 3;
    const rank = getRandomRank();

    document.getElementById('resultSym').textContent = selectedSeiza.sym;
    document.getElementById('resultName').textContent = selectedSeiza.name;
    document.getElementById('resultRank').textContent = `今日の運勢ランキング ${rank}`;
    document.getElementById('resultStars').innerHTML = renderStars(stars);
    document.getElementById('fortuneBody').textContent = mainText;

    const luckyBox = document.getElementById('luckyBox');
    if (luckyValue) {
      document.getElementById('luckyValue').textContent = luckyValue;
      luckyBox.style.display = 'flex';
    } else {
      luckyBox.style.display = 'none';
    }

    show('result');

    // 流れ星演出
    for (let i = 0; i < 5; i++) {
      setTimeout(shootingStar, i * 200);
    }

  } catch(e) {
    const msg = e.message === '401' ? 'API keyが必要です' :
                e.message === '429' ? 'しばらく時間をおいてお試しください' :
                '星の声が届きませんでした…';
    document.getElementById('errorText').textContent = msg;
    show('error');
  }
}
</script>
